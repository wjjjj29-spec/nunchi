<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Name in Hangul – Nunchi widget</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://hellonunchi.com/tools/my-name-in-hangul/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/nunchi.css">
<style>body{margin:0}.panel{padding:16px}.hangul-big{font-size:44px}</style>
</head>
<body data-root="/" data-room="love" data-embed="/tools/my-name-in-hangul/?utm_source=embed">
<div class="wrap narrow">
  <div class="panel">
    <div class="field"><label for="name">Your name in Korean</label><input type="text" id="name" placeholder="e.g. Emily Carter" autocomplete="off" autocapitalize="words"></div>
    <button class="btn" id="go">Write it in Hangul</button>
    <div class="result" id="res">
      <div class="stat big" style="margin-top:14px;text-align:center"><div class="k">How a Korean writes it</div><div class="v hangul-big" id="out">—</div><div class="d" id="say"></div></div>
      <p class="read" id="read" style="font-size:17px"></p>
      <p class="note" style="margin-top:10px">Friends call you <b id="voc"></b> · <a id="more" href="https://hellonunchi.com/tools/my-name-in-hangul/?utm_source=embed" target="_blank" rel="noopener">see the full version →</a></p>
    </div>
  </div>
</div>
<script src="/assets/nunchi.js?v=20261001"></script>
<script src="/assets/hangul-names.js?v=20261001"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const CHO=["g","kk","n","d","tt","r","m","b","pp","s","ss","","j","jj","ch","k","t","p","h"], JUNG=["a","ae","ya","yae","eo","e","yeo","ye","o","wa","wae","oe","yo","u","wo","we","wi","yu","eu","ui","i"], JONG=["","k","k","k","n","n","n","t","l","k","m","l","l","l","l","l","m","p","p","t","t","ng","t","t","k","t","p","t"];
  const roman=s=>[...s].map(ch=>{const c=ch.charCodeAt(0)-0xAC00;if(c<0||c>11171)return ch;const cho=Math.floor(c/588),jung=Math.floor((c%588)/28),jong=c%28;return CHO[cho]+JUNG[jung]+JONG[jong];}).join("-");
  const READ={"ㄱ":"the steady one — you finish what you start","ㄴ":"soft-spoken, notices everything, forgets nothing","ㄷ":"straight talker","ㄹ":"the flowing one — you make rooms relax","ㅁ":"warm; the friend who remembers birthdays","ㅂ":"bright, a little loud, first on the dance floor","ㅅ":"quick and sharp, you read the room fast","ㅇ":"open and round — everyone's favourite plus-one","ㅈ":"the planner with the trip spreadsheet","ㅊ":"sparkly — Koreans will say you have 끼","ㅋ":"big laugh, bigger appetite","ㅌ":"solid and dependable","ㅍ":"fresh air — the mood lifts when you arrive","ㅎ":"the smile — 순하다 (gentle) within a week"};
  const chosung=h=>["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"][Math.floor((h.charCodeAt(0)-0xAC00)/588)];
  function run(){
    const name=$("name").value.trim(); if(!name){$("name").focus();return;}
    const parts=HANGUL_NAMES.convert(name); if(!parts.length) return;
    const full=parts.map(p=>p.hangul).join(" "), first=parts[0].hangul;
    $("out").textContent=full; $("say").textContent="Said roughly: "+parts.map(p=>roman(p.hangul)).join("  ");
    const cs=chosung(first).replace(/ㄲ/,"ㄱ").replace(/ㄸ/,"ㄷ").replace(/ㅃ/,"ㅂ").replace(/ㅆ/,"ㅅ").replace(/ㅉ/,"ㅈ");
    $("read").innerHTML=`Nunchi read: names starting with <b>${cs}</b> are ${READ[cs]||READ["ㅇ"]}.`;
    $("voc").textContent=((first.charCodeAt(first.length-1)-0xAC00)%28?first+"아":first+"야")+"!";
    $("more").href="https://hellonunchi.com/tools/my-name-in-hangul/?utm_source=embed&n="+encodeURIComponent(name);
    $("res").classList.add("show");
  }
  $("go").onclick=run; $("name").addEventListener("keydown",e=>{if(e.key==="Enter")run();});
})();
</script>
</body>
</html>
